name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with missing bundle-id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: ''
          issuer-id: 'some-issuer-id'
          api-key-id: 'SOMEKEY'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake0000000000000
            0000000000000000000000000000000000000000000hRANCAATfakefakefakefake
            fakefakefakefakefakefakefakefakefakefakefake
            -----END PRIVATE KEY-----
      - name: Assert action failed due to missing bundle-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing bundle-id, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing bundle-id"
