name: Test development profile type with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with IOS_APP_DEVELOPMENT profile type (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: 'com.example.devapp'
          profile-type: 'IOS_APP_DEVELOPMENT'
          issuer-id: '11111111-1111-1111-1111-111111111111'
          api-key-id: 'DEVKEYID01'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hih
            lCMs5YG4imtPloGfR68yUqgqwqChRANCAARny9I/6XyTpE1ZCMkqvHgJrmar2rAm
            -----END PRIVATE KEY-----

      - name: Assert action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with IOS_APP_DEVELOPMENT profile type and invalid credentials"
