name: Test invalid profile type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid profile-type (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: 'com.example.testapp'
          profile-type: 'INVALID_PROFILE_TYPE'
          issuer-id: 'invalid-issuer-id'
          api-key-id: 'INVALIDKEY'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake0000000000000
            0000000000000000000000000000000000000000000hRANCAATfakefakefakefake
            fakefakefakefakefakefakefakefakefakefakefake
            -----END PRIVATE KEY-----
      - name: Assert action failed with invalid profile-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid profile-type, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid profile-type"
