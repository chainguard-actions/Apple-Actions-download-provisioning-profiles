name: Test without profile-type (optional input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without profile-type (optional input omitted)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.testapp
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: AAAAAAAAAA
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqbMBFpnGRkpAGqzpEKnLhKGhRANCAARxy5u39/yqw2tI98mVa5+/kE9HB5P
            -----END PRIVATE KEY-----

      - name: Assert action ran (failed at API, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not due to missing profile-type
          # (profile-type is optional). Any outcome other than a startup crash is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "UNEXPECTED SUCCESS: action should have failed with dummy credentials"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid credentials, profile-type correctly treated as optional)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
