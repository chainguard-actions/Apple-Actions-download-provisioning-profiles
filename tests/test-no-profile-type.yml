name: Test without optional profile-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without profile-type (optional input omitted)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.testapp
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: AAAAAAAAAA
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4GCCqGSM49AwEHoUQDQgAEYD54V/vp+54P9DXarYqx4MPcm+HKRIReGarZa1Wh
            4ocqlMiKLM2hKHSMJ1YnGUOiDyVovn4XBmHFMSMdAqWlIQ==
            -----END PRIVATE KEY-----
      - name: Assert action ran (profile-type is optional, action should attempt to run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to invalid credentials,
          # but NOT be skipped — it must have actually run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME), profile-type is correctly optional"
