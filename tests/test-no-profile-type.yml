name: Test without optional profile-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.testapp
          issuer-id: 12345678-1234-1234-1234-123456789012
          api-key-id: ABCDEF1234
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqBmIKuq5iIkxxqg6agAtU6KhRANCAAQRWxNaa3JifhkKt1bX9iMKV0hcMEFh
            lPfaQe+RB5SkxJAkCx9M8wMbjt4gu7vAV9tQL5ABnNMECBxaFHnv
            -----END PRIVATE KEY-----

      - name: Assert action failed (invalid credentials should cause failure even without profile-type)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (no profile-type)"
