name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        with:
          bundle-id: 'com.example.testapp'
          profile-type: 'IOS_APP_STORE'
          issuer-id: '00000000-0000-0000-0000-000000000000'
          api-key-id: 'FAKEKEYID1'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hih
            lCg5wF/pszAeberFRLdhWs0i2oShRANCAAQRWxNda9aM3HoEHjBizjO6HjFos9g7
            tgaeEFQF3orcFnDNAVm5tNe9AAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END PRIVATE KEY-----
        continue-on-error: true

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
