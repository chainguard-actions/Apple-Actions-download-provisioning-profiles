name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: 'com.example.testapp'
          profile-type: 'IOS_APP_STORE'
          issuer-id: '00000000-0000-0000-0000-000000000000'
          api-key-id: 'FAKEKEYID1'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hih
            lCMs5YG4imtPloGfR68yUqgqwqChRANCAARny9I/6XyTpE1ZCMkqvHgJrmar2rAm
            -----END PRIVATE KEY-----
          
      - name: Assert action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
