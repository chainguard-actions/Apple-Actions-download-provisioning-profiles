name: Test invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with dummy credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.testapp
          profile-type: IOS_APP_STORE
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: AAAAAAAAAA
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqbMBFpnGRkpAGqzpEKnLhKGhRANCAARxy5u39/yqw2tI98mVa5+/kE9HB5P
            -----END PRIVATE KEY-----
          
      - name: Assert action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "UNEXPECTED SUCCESS: action should have failed with dummy credentials"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
