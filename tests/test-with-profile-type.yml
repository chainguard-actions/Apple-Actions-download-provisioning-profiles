name: Test with profile-type input specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a fake PKCS8 private key for testing
        run: |
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /tmp/fake-key.pem 2>/dev/null
          echo "FAKE_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/fake-key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: 'com.example.invalid-test-app'
          profile-type: 'IOS_APP_STORE'
          issuer-id: '00000000-0000-0000-0000-000000000000'
          api-key-id: 'FAKEKEYID1'
          api-private-key: ${{ env.FAKE_PRIVATE_KEY }}

      - name: Assert action failed (not a crash) when profile-type is specified
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with profile-type=IOS_APP_STORE and invalid credentials"

      - name: Assert profiles output is empty on failure
        env:
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "profiles output: '$PROFILES'"
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected profiles output to be empty on failure, but got: $PROFILES"
            exit 1
          fi
          echo "PASS: profiles output is empty as expected on failure"
