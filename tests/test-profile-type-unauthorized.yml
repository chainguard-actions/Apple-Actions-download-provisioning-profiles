name: Test profile-type input with unauthorized credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway PKCS8 P-256 key
        id: key
        run: |
          KEY="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 2>/dev/null)"
          if [ -z "$KEY" ]; then
            echo "FAIL: could not generate key"
            exit 1
          fi
          {
            echo "pem<<KEY_EOF"
            echo "$KEY"
            echo "KEY_EOF"
          } >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.nonexistent.app
          profile-type: IOS_APP_STORE
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: ABCDEFGHIJ
          api-private-key: ${{ steps.key.outputs.pem }}
      - name: Assert action failed gracefully and produced no profiles
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with unauthorized credentials"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
