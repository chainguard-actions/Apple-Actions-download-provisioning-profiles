name: Test invalid private key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-id: com.example.app
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: ABCDEFGHIJ
          api-private-key: not-a-valid-pkcs8-private-key
      - name: Assert action failed and produced no profiles
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with a malformed private key"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
      - name: Assert no profiles written
        run: |
          DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "FAIL: unexpected files in $DIR"
            ls -la "$DIR"
            exit 1
          fi
          echo "PASS"
